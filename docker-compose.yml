# ==============================================================================
# Docker Compose for Google A2A Multi-Agent System
# Runs the Unified Multi-Agent Gateway, Visualizer UI, and all three agents
# (SQL Agent, RAG Agent, Podcast Agent) on Port 8000.
# ==============================================================================

services:
  a2a-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: a2a-gateway
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/.well-known/agent-card.json"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - a2a-network

networks:
  a2a-network:
    driver: bridge
